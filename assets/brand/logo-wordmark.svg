  <defs>
    <linearGradient id="st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9b6bff"/><stop offset="1" stop-color="#42c8ff"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d5cff"/><stop offset="1" stop-color="#b48cff"/></linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-width="7.5" transform="translate(6 10)">
    <path d="M14 24H30Q38 24 38 32V94" stroke="url(#st)"/>
    <path d="M78 24H62Q54 24 54 32V94" stroke="url(#st)"/>
